# PayCheck — Cloudflare Worker + D1 + static public/.
# PAY_TO and BUNDLE_PROXY_SECRET are Worker secrets. Set them with
# `wrangler secret put`. Never put them in [vars] or in git.
# database_id is the production D1 database created with `wrangler d1 create paycheck`.

name = "paycheck"
main = "src/index.ts"
compatibility_date = "2025-06-17"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "paycheck"
database_id = "28072b38-1405-4e83-91aa-6c16a1a6e580"
migrations_dir = "migrations"
